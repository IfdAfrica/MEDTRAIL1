services:
  - type: web
    name: medtrail-upload-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medtrail-db
          property: connectionString
      - key: STORAGE_DIR
        value: /tmp/medtrail-storage
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: medtrail-db
    plan: free
